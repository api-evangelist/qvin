aid: qvin
name: Qvin
description: 'Qvin is a women''s health diagnostics company that develops the Q-Pad, described as the first
  and only FDA-cleared diagnostic menstrual pad, enabling non-invasive at-home health screening from menstrual
  blood. The company analyzes collected samples in its CLIA-certified laboratory to test biomarkers for conditions
  such as diabetes (A1c), and is researching screening for cervical cancer, endometriosis, sexually transmitted
  infections, and uterine fibroids. Qvin operates as a consumer and clinical diagnostics provider rather than
  a developer platform, and does not currently publish a public API, SDKs, or developer documentation. This
  profile was added to the API Evangelist network as a portfolio company of Version One Ventures.'
